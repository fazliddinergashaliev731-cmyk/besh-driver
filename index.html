<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B2A5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Besh Express — Водитель</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--navy:#0B2A5B;--green:#22C55E;--line:#E5E7EB;--mut:#6B7280;--tab:58px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overflow:hidden}
body{font:15px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#111827;background:#F3F5F9}
[hidden]{display:none!important}
#map{position:absolute;top:0;left:0;right:0;bottom:300px}
#top{position:absolute;z-index:10;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;justify-content:space-between}
.chip{background:#fff;border:0;border-radius:22px;padding:9px 14px;box-shadow:0 2px 10px #0003;font:inherit;font-weight:700;color:var(--navy)}
.chip.on{background:var(--green);color:#052e16}
#loc{position:absolute;z-index:10;right:12px;top:calc(64px + env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px #0003;font-size:22px;color:var(--navy)}
#sheet{position:absolute;z-index:10;left:0;right:0;bottom:calc(var(--tab) + env(safe-area-inset-bottom));background:#fff;border-radius:22px 22px 0 0;padding:14px 16px;box-shadow:0 -4px 20px #0003;max-height:58vh;overflow:auto}
#sheet:before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:#D1D5DB;margin:0 auto 10px}
#tabs{position:absolute;z-index:30;left:0;right:0;bottom:0;height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex}
#tabs button{flex:1;border:0;background:none;font:inherit;font-weight:700;font-size:13px;color:var(--mut);cursor:pointer}
#tabs button.on{color:var(--green)}
#page{position:absolute;z-index:20;left:0;right:0;top:0;bottom:calc(var(--tab) + env(safe-area-inset-bottom));background:#F3F5F9;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 20px}
h3{margin:0 0 6px;font-size:20px;color:var(--navy)}small,.m{color:var(--mut)}.m{margin:2px 0}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-size:30px;font-weight:800;color:var(--navy)}.b{font-weight:700}
input{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin:6px 0;background:#fff}
button.p,button.s,button.d{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px}
button.p{background:var(--green);color:#052e16}button.s{background:#F3F4F6;color:#111827}button.d{background:#FEE2E2;color:#991B1B}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two button{margin-top:8px;padding:12px;font-size:15px}
.me{width:18px;height:18px;border-radius:50%;background:#2563EB;border:4px solid #fff;box-shadow:0 0 0 8px #2563EB33}
.dot{width:20px;height:20px;border-radius:50%;border:4px solid #fff;box-shadow:0 1px 6px #0006}
.scr{max-width:380px;margin:6vh auto;padding:20px}.scr h1{margin:0 0 4px;color:var(--navy)}.scr h1 span{color:var(--green)}
#err{color:#B91C1C;min-height:18px}
.maplibregl-ctrl-bottom-left{bottom:300px!important}
</style>
</head>
<body>
<div id="auth" class="scr">
  <h1>Besh <span>Express</span></h1><div class="m" style="margin-bottom:14px">Водитель</div>
  <input id="nm" placeholder="Имя и фамилия" hidden>
  <input id="em" type="email" placeholder="Почта"><input id="pw" type="password" placeholder="Пароль (от 6 символов)">
  <div id="err"></div>
  <button class="p" id="go">Войти</button><button class="s" id="sw">Нет аккаунта? Регистрация</button>
</div>
<div id="setup" class="scr" hidden></div>
<div id="pend" class="scr" hidden></div>
<div id="app" hidden>
  <div id="map"></div>
  <div id="top"><span class="chip" id="st"></span><span class="chip" id="bal"></span></div>
  <button id="loc">◎</button>
  <div id="sheet"></div>
  <div id="page" hidden></div>
  <div id="tabs"><button data-t="map" class="on">Карта</button><button data-t="earn">Заработок</button><button data-t="wallet">Баланс</button><button data-t="me">Профиль</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const MAP_STYLE = 'https://tiles.openfreemap.org/styles/positron';
const SB = supabase.createClient('https://krphkeevnrtkcnsqbxfo.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtycGhrZWV2bnJ0a2Nuc3FieGZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzODE0NzQsImV4cCI6MjEwNzk1NzQ3NH0.gXe8uTesz1NSEmiRTBXiP3uvAEm9GV2OENcLaVfyIoU', {auth: {storageKey: 'besh-driver-auth'}});
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ru-RU') + ' сум';
const dt = s => new Date(s).toLocaleString('ru-RU', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
const C = [70.61, 40.436];
let reg = false, uid, D, map, online = false, w = {balance: 0, bonus_balance: 0}, offer = null, act = null, pct = 8, pos = null, rtKey = '', rt = null, meM, mA, mB, lastKey = '', seen = null, ac, wl, tab = 'map';

function screen(n) { ['auth', 'setup', 'pend', 'app'].forEach(x => $('#' + x).hidden = x !== n); }
$('#sw').onclick = () => { reg = !reg; $('#nm').hidden = !reg; $('#go').textContent = reg ? 'Зарегистрироваться' : 'Войти'; $('#sw').textContent = reg ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Регистрация'; };
$('#go').onclick = async () => {
  $('#err').textContent = '';
  const e = $('#em').value.trim(), p = $('#pw').value;
  const r = reg ? await SB.auth.signUp({email: e, password: p, options: {data: {role: 'driver', full_name: $('#nm').value}}}) : await SB.auth.signInWithPassword({email: e, password: p});
  if (r.error) return $('#err').textContent = r.error.message;
  if (!r.data.session) return $('#err').textContent = 'Подтвердите почту и войдите.';
  gate();
};
const out = async () => { await SB.auth.signOut(); location.reload(); };

// ---- вход, анкета, проверка ----
const FIELDS = [['car_model', 'Марка и модель *'], ['car_color', 'Цвет *'], ['plate', 'Госномер *'], ['license_no', 'Номер прав *'], ['pinfl', 'ПИНФЛ'], ['license_card_no', 'Лицензионная карточка (номер)'], ['license_card_expiry', 'Карточка до (ГГГГ-ММ-ДД)'], ['tech_passport_no', 'Техпаспорт (номер)']];
async function gate() {
  const {data: {user}} = await SB.auth.getUser(); if (!user) return;
  uid = user.id;
  D = (await SB.from('drivers').select('*').eq('id', uid).maybeSingle()).data;
  if (!D) {
    $('#setup').innerHTML = '<h1>Besh <span>Express</span></h1><h3>Данные водителя и автомобиля</h3>' + FIELDS.map(([k, l]) => `<input data-k="${k}" placeholder="${l}">`).join('') + '<button class="p" id="sub">Отправить на проверку</button><button class="s" id="lo1">Выйти</button>';
    $('#lo1').onclick = out;
    $('#sub').onclick = async () => {
      const row = {id: uid, is_self_employed: false}; let ok = true;
      document.querySelectorAll('#setup input').forEach(i => { row[i.dataset.k] = i.value.trim() || null; });
      for (const k of ['car_model', 'car_color', 'plate', 'license_no']) if (!row[k]) ok = false;
      if (!ok) return alert('Заполните поля со звёздочкой');
      const {error} = await SB.from('drivers').insert(row); if (error) return alert(error.message); gate();
    };
    return screen('setup');
  }
  if (D.status !== 'approved') {
    $('#pend').innerHTML = `<h1>Besh <span>Express</span></h1><div class="card"><h3>${D.status === 'blocked' ? 'Доступ закрыт' : 'Заявка на проверке'}</h3><div class="m">${D.status === 'blocked' ? 'Обратитесь в поддержку Besh Express.' : 'Администратор проверит данные и одобрит аккаунт. После одобрения вы получите бонус.'}</div></div><button class="p" id="re">Проверить снова</button><button class="s" id="lo2">Выйти</button>`;
    $('#re').onclick = gate; $('#lo2').onclick = out; return screen('pend');
  }
  screen('app'); initApp();
}

// ---- карта ----
const dot = c => { const d = document.createElement('div'); d.className = 'dot'; d.style.background = c; return d; };
function initApp() {
  if (map) return;
  online = D.is_online;
  map = new maplibregl.Map({container: 'map', style: MAP_STYLE, center: C, zoom: 14, attributionControl: {compact: true}});
  map.on('load', () => {
    map.addSource('route', {type: 'geojson', data: {type: 'Feature', geometry: {type: 'LineString', coordinates: []}}});
    map.addLayer({id: 'rc', type: 'line', source: 'route', layout: {'line-cap': 'round', 'line-join': 'round'}, paint: {'line-color': '#fff', 'line-width': 10}});
    map.addLayer({id: 'rl', type: 'line', source: 'route', layout: {'line-cap': 'round', 'line-join': 'round'}, paint: {'line-color': '#0B2A5B', 'line-width': 5}});
  });
  SB.from('settings').select('value').eq('key', 'commission_percent').maybeSingle().then(r => r.data && (pct = Number(r.data.value)));
  navigator.geolocation?.watchPosition(p => {
    const first = !pos; pos = {lat: p.coords.latitude, lng: p.coords.longitude};
    if (!meM) { const e = document.createElement('div'); e.className = 'me'; meM = new maplibregl.Marker({element: e}).setLngLat([pos.lng, pos.lat]).addTo(map); } else meM.setLngLat([pos.lng, pos.lat]);
    if (first) { map.flyTo({center: [pos.lng, pos.lat], zoom: 15}); push(); }
  }, () => alert('Разрешите доступ к геолокации в браузере.'), {enableHighAccuracy: true});
  setInterval(push, 10000); setInterval(refresh, 4000); setInterval(tick, 1000);
  $('#loc').onclick = () => pos && map.flyTo({center: [pos.lng, pos.lat], zoom: 16});
  refresh();
}
async function push() { if (online && pos) await SB.from('drivers').update({lat: pos.lat, lng: pos.lng, location_updated_at: new Date().toISOString()}).eq('id', uid); }
async function wake() { try { wl = await navigator.wakeLock.request('screen'); } catch (e) {} }
function beep() {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.connect(g); g.connect(ac.destination);
    o.frequency.value = 880; g.gain.value = 0.2; o.start(); o.stop(ac.currentTime + 0.35); } catch (e) {} navigator.vibrate?.([300, 150, 300]);
}
async function toggle(v) {
  if (v) {
    if (!pos) return alert('Не определено ваше место. Разрешите геолокацию.');
    if (Number(w.balance) + Number(w.bonus_balance) < 0) return alert('Баланс ниже нуля. Пополните баланс.');
    beep(); wake();
  }
  const {error} = await SB.from('drivers').update({is_online: v}).eq('id', uid); if (error) return alert(error.message);
  online = v; push(); view();
}
async function call(fn, args) { const {error} = await SB.rpc(fn, args); if (error) alert(error.message); await refresh(); }
async function getRoute(a, b) {
  let r = null;
  try { const x = (await (await fetch(`https://router.project-osrm.org/route/v1/driving/${a[0]},${a[1]};${b[0]},${b[1]}?overview=full&geometries=geojson`)).json()).routes[0];
    r = {km: x.distance / 1000, min: x.duration / 60, coords: x.geometry.coordinates}; } catch (e) {}
  return r;
}
function draw(coords) {
  const s = map.getSource('route'); if (!s) return;
  s.setData({type: 'Feature', geometry: {type: 'LineString', coordinates: coords}});
  if (coords.length > 1) map.fitBounds(coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0])), {padding: {top: 90, bottom: 30, left: 40, right: 40}, duration: 600, maxZoom: 17});
}
async function refresh() {
  const [wr, of, ac_] = await Promise.all([
    SB.from('wallets').select('*').eq('user_id', uid).maybeSingle(),
    SB.from('order_offers').select('order_id,expires_at').eq('driver_id', uid).eq('status', 'pending').gt('expires_at', new Date().toISOString()).limit(1),
    SB.from('orders').select('*').eq('driver_id', uid).in('status', ['accepted', 'arrived', 'in_progress']).limit(1)]);
  if (wr.data) w = wr.data;
  act = ac_.data?.[0] || null; offer = null;
  if (!act && of.data?.[0]) {
    const {data: o} = await SB.from('orders').select('*').eq('id', of.data[0].order_id).maybeSingle();
    if (o) { offer = {o, exp: new Date(of.data[0].expires_at).getTime()}; if (seen !== o.id) { seen = o.id; beep(); } }
  }
  const key = act ? act.id + act.status : offer ? offer.o.id : '';
  if (key !== rtKey) {
    rtKey = key; rt = null; [mA, mB].forEach(m => m && m.remove()); mA = mB = null; draw([]);
    const o = act || offer?.o;
    if (o) {
      mA = new maplibregl.Marker({element: dot('#22C55E')}).setLngLat([o.pickup_lng, o.pickup_lat]).addTo(map);
      mB = new maplibregl.Marker({element: dot('#0B2A5B')}).setLngLat([o.dropoff_lng, o.dropoff_lat]).addTo(map);
      const a = act?.status === 'in_progress' ? [o.pickup_lng, o.pickup_lat] : pos ? [pos.lng, pos.lat] : null;
      const b = act?.status === 'in_progress' ? [o.dropoff_lng, o.dropoff_lat] : [o.pickup_lng, o.pickup_lat];
      if (a) { rt = await getRoute(a, b); if (rt) draw(rt.coords); }
    }
  }
  view();
}
function tick() { const e = $('#cd'); if (e && offer) e.textContent = Math.max(0, Math.round((offer.exp - Date.now()) / 1000)); }

// ---- нижняя панель ----
const NEXT = {accepted: ['arrived', 'Я приехал'], arrived: ['in_progress', 'Начать поездку']};
const LBL = {accepted: 'Едете к клиенту', arrived: 'Ждёте клиента', in_progress: 'Поездка идёт'};
const nav = (lat, lng) => `<div class="two"><a href="https://yandex.com/maps/?rtext=~${lat},${lng}&rtt=auto" target="_blank"><button class="s">Яндекс Карты</button></a><a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving" target="_blank"><button class="s">Google Maps</button></a></div>`;
function route(o) { return `<div class="m">Откуда: <b>${esc(o.pickup_address || 'точка на карте')}</b></div><div class="m">Куда: <b>${esc(o.dropoff_address || 'точка на карте')}</b></div><div class="m">Поездка ${o.distance_km} км · комиссия ${pct}%: ${fmt(Math.round(o.price * pct / 100))}</div>`; }
function view() {
  $('#st').textContent = online ? '● На линии' : 'Не на линии'; $('#st').className = 'chip' + (online ? ' on' : '');
  $('#bal').textContent = fmt(Number(w.balance) + Number(w.bonus_balance));
  let h;
  if (act) {
    const goPick = act.status !== 'in_progress', eta = rt ? `<div class="m"><b>${goPick ? 'До клиента' : 'До места'}: ~${Math.max(1, Math.round(rt.min))} мин · ${rt.km.toFixed(1)} км</b></div>` : '';
    h = `<h3>${LBL[act.status]}</h3>${eta}${route(act)}<div class="m">Получить с клиента: <b>${fmt(act.price)}</b> (наличные)</div>${goPick ? nav(act.pickup_lat, act.pickup_lng) : nav(act.dropoff_lat, act.dropoff_lng)}`
      + (NEXT[act.status] ? `<button class="p" data-a="next">${NEXT[act.status][1]}</button>` : '<button class="p" data-a="fin">Завершить поездку</button>');
  } else if (offer) {
    const o = offer.o;
    h = `<div class="row"><h3>Новый заказ</h3><h3><span id="cd">${Math.max(0, Math.round((offer.exp - Date.now()) / 1000))}</span> с</h3></div><div class="big">${fmt(o.price)}</div>`
      + (rt ? `<div class="m"><b>Подача: ~${Math.max(1, Math.round(rt.min))} мин · ${rt.km.toFixed(1)} км</b></div>` : '') + route(o)
      + '<button class="p" data-a="acc">Принять</button><button class="d" data-a="dec">Отказать</button>';
  } else if (online) h = '<h3>Ищем заказы рядом…</h3><div class="m">Держите страницу открытой. Заказы приходят со звуком.</div><button class="s" data-a="off">Уйти с линии</button>';
  else h = '<h3>Вы не на линии</h3><div class="m">Выйдите на линию, чтобы получать заказы.</div><button class="p" data-a="on">Выйти на линию</button>';
  if (h !== lastKey) { lastKey = h; $('#sheet').innerHTML = h; }
  $('#map').style.bottom = `calc(${$('#sheet').offsetHeight - 18}px + var(--tab) + env(safe-area-inset-bottom))`; map.resize();
}
$('#sheet').onclick = e => {
  const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
  if (a === 'on') toggle(true); else if (a === 'off') toggle(false);
  else if (a === 'acc') call('accept_order', {p_order: offer.o.id});
  else if (a === 'dec') call('decline_order', {p_order: offer.o.id});
  else if (a === 'next') call('driver_update_status', {p_order: act.id, p_status: NEXT[act.status][0]});
  else if (a === 'fin') call('complete_order', {p_order: act.id});
};

// ---- вкладки ----
const TX = {signup_bonus: 'Бонус за регистрацию', referral_bonus: 'Бонус за друга', commission: 'Комиссия', topup: 'Пополнение', adjustment: 'Корректировка'};
$('#tabs').onclick = async e => {
  const t = e.target.dataset.t; if (!t) return; tab = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  const P = $('#page'); P.hidden = t === 'map'; if (t === 'map') return map.resize();
  P.innerHTML = '<div class="m">Загрузка…</div>';
  if (t === 'earn') {
    const {data} = await SB.from('orders').select('price,commission,completed_at,pickup_address,dropoff_address').eq('driver_id', uid).eq('status', 'completed').order('completed_at', {ascending: false}).limit(300);
    const rows = data || [], t0 = new Date(); t0.setHours(0, 0, 0, 0);
    const w0 = new Date(t0); w0.setDate(w0.getDate() - 6); const m0 = new Date(t0); m0.setDate(1);
    const sum = a => a.reduce((x, o) => x + Number(o.price) - Number(o.commission), 0);
    P.innerHTML = '<h3>Заработок</h3>' + [['Сегодня', t0], ['7 дней', w0], ['Этот месяц', m0]].map(([l, d]) => { const a = rows.filter(o => new Date(o.completed_at) >= d);
      return `<div class="card"><div class="m">${l} · чистый заработок</div><div class="big">${fmt(sum(a))}</div><div class="m">Поездок: ${a.length}</div></div>`; }).join('')
      + '<h3 style="margin-top:14px">Последние поездки</h3>' + (rows.slice(0, 20).map(o => `<div class="card"><div class="m">${dt(o.completed_at)}</div><div>${esc(o.pickup_address || '—')} → ${esc(o.dropoff_address || '—')}</div><div class="b">${fmt(o.price)} · комиссия ${fmt(o.commission)}</div></div>`).join('') || '<div class="m">Поездок пока нет</div>');
  } else if (t === 'wallet') {
    const [wr, tx] = await Promise.all([SB.from('wallets').select('*').eq('user_id', uid).maybeSingle(), SB.from('wallet_transactions').select('*').eq('user_id', uid).order('created_at', {ascending: false}).limit(30)]);
    const x = wr.data || w;
    P.innerHTML = `<h3>Баланс</h3><div class="card"><div class="m">Баланс (пополнение)</div><div class="big">${fmt(x.balance)}</div><div class="m">Бонус</div><div class="big">${fmt(x.bonus_balance)}</div></div>
      <div class="card"><div class="b">Пополнить</div><div class="m">Оплата через Payme и Click скоро. Сейчас баланс пополняет администратор Besh Express.</div><div class="b" style="margin-top:10px">Вывод</div><div class="m">Наличные за поездки вы получаете от клиентов сами. С баланса списывается только комиссия. Бонус не выводится.</div></div>
      <h3 style="margin-top:14px">История</h3>` + ((tx.data || []).map(r => `<div class="card row"><div><div class="b">${TX[r.type] || r.type}</div><small>${dt(r.created_at)}</small></div><div class="b" style="color:${r.amount < 0 ? '#B91C1C' : '#15803D'}">${r.amount > 0 ? '+' : ''}${fmt(r.amount)}</div></div>`).join('') || '<div class="m">Операций пока нет</div>');
  } else {
    const p = (await SB.from('profiles').select('full_name').eq('id', uid).maybeSingle()).data || {};
    const R = [['Машина', `${D.car_model}, ${D.car_color}`], ['Госномер', D.plate], ['Права', D.license_no], ['ПИНФЛ', D.pinfl || '—'], ['Карточка такси', `${D.license_card_no || '—'} ${D.license_card_expiry || ''}`], ['Рейтинг', D.rating]];
    P.innerHTML = `<h3>Профиль</h3><div class="m">Имя</div><input id="fn" value="${esc(p.full_name)}"><button class="p" id="sv">Сохранить имя</button>
      <div class="card" style="margin-top:14px">${R.map(([a, b]) => `<div class="m">${a}: <b>${esc(b)}</b></div>`).join('')}</div>
      <div class="m">Чтобы изменить документы или машину, обратитесь к администратору.</div><button class="s" id="lo">Выйти из аккаунта</button>`;
    $('#sv').onclick = async () => { const {error} = await SB.from('profiles').update({full_name: $('#fn').value}).eq('id', uid); alert(error ? error.message : 'Сохранено'); };
    $('#lo').onclick = out;
  }
};

SB.auth.getSession().then(({data}) => { if (data.session) gate(); });
</script>
<script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
